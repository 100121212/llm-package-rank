name: PocketStation Commons originals temp
on:
  push:
    paths:
      - .github/workflows/pocketstation-assets-temp.yml
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact Commons originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pocketstation-commons-originals
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.parse, urllib.request
          files=["PocketStation logo.svg","PocketStation white.jpg","PocketStation.jpg","SCPH-4000.jpg","Sony-PocketStation.jpg","Sony-PocketStation.png","WonderSwan-WonderWave-PocketStation.jpg"]
          out=pathlib.Path("pocketstation-commons-originals")
          headers={"User-Agent":"PocketStation-asset-fetch/1.0"}
          manifest=[]
          for name in files:
              q=urllib.parse.urlencode({"action":"query","format":"json","prop":"imageinfo","iiprop":"url|size|mime|extmetadata","titles":"File:"+name})
              with urllib.request.urlopen(urllib.request.Request("https://commons.wikimedia.org/w/api.php?"+q,headers=headers),timeout=60) as r:
                  data=json.load(r)
              page=next(iter(data["query"]["pages"].values()))
              ii=page["imageinfo"][0]
              with urllib.request.urlopen(urllib.request.Request(ii["url"],headers=headers),timeout=120) as r:
                  blob=r.read()
              if len(blob)!=int(ii["size"]): raise RuntimeError(f"size mismatch: {name}")
              (out/name).write_bytes(blob)
              ext=ii.get("extmetadata",{})
              manifest.append({"file":name,"commons_page":"https://commons.wikimedia.org/wiki/File:"+urllib.parse.quote(name.replace(" ","_")),"original_url":ii["url"],"bytes":len(blob),"width":ii.get("width"),"height":ii.get("height"),"mime":ii.get("mime"),"sha256":hashlib.sha256(blob).hexdigest(),"artist":ext.get("Artist",{}).get("value"),"license_short_name":ext.get("LicenseShortName",{}).get("value"),"license_url":ext.get("LicenseUrl",{}).get("value"),"description":ext.get("ImageDescription",{}).get("value")})
          (out/"commons-manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
          (cd pocketstation-commons-originals && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: pocketstation-commons-originals
          path: pocketstation-commons-originals/
          retention-days: 1
          compression-level: 0
